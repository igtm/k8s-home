kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: argo
  namespace: argo
  annotations:
    ingress.kubernetes.io/rewrite-target: /
    ingress.kubernetes.io/protocol: https # Traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web

spec:
  rules:
    - host: "argo.k8s-m1.igtm.link"
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name: argo-server
                port:
                  number: 2746
            path: /